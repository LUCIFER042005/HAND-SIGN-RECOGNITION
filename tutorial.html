<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Language Tutorial & Dictionary</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            color: #fff;
            margin: 0;
            padding: 30px 15px;
        }
        .container {
            max-width: 1050px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        h1 {
            color: #4af6c6;
            margin: 0;
            font-size: 26px;
        }
        .btn-back {
            background: #2a2a2a;
            border: 1px solid #4af6c6;
            color: #4af6c6;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
        }
        .btn-back:hover {
            background: #4af6c6;
            color: #121212;
        }
        .subtitle {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .guide-card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .guide-card:hover {
            transform: translateY(-4px);
            border-color: #4af6c6;
            box-shadow: 0 6px 20px rgba(74, 246, 198, 0.1);
        }
        .card-top {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 12px;
        }
        .letter-badge {
            width: 55px;
            height: 55px;
            background: #2a2a2a;
            border: 2px solid #4af6c6;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: #4af6c6;
        }
        .emoji-icon {
            font-size: 28px;
        }
        .card-title {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
        }
        .instructions {
            font-size: 13px;
            color: #bbb;
            line-height: 1.6;
            background: #252525;
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid #4af6c6;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📖 Sign Language Alphabet Guide</h1>
        <a href="/" class="btn-back">⬅ Return to Main App</a>
    </div>

    <div class="subtitle">
        Explore hand sign formations with step-by-step finger posture instructions.
    </div>

    <div class="cards-grid" id="guideGrid">
        <!-- Generated by JavaScript -->
    </div>
</div>

<script>
    const signGuide = {
        "A": { emoji: "✊", title: "Letter A", guide: "Make a tight fist with all 4 fingers folded down, resting your thumb straight alongside your index finger." },
        "B": { emoji: "✋", title: "Letter B", guide: "Hold all 4 fingers straight up together, with your thumb folded flat across your palm." },
        "C": { emoji: "🤏", title: "Letter C", guide: "Curve all fingers and thumb together into a half circle to form the shape of the letter 'C'." },
        "D": { emoji: "☝️", title: "Letter D", guide: "Point your index finger straight up while your thumb and other three fingers touch to make a small circle." },
        "E": { emoji: "✊", title: "Letter E", guide: "Curl all fingertips tightly down onto the palm with the thumb folded underneath them." },
        "F": { emoji: "👌", title: "Letter F", guide: "Touch your index finger and thumb tip together into a circle, holding the remaining 3 fingers straight up." },
        "G": { emoji: "👉", title: "Letter G", guide: "Point your index finger horizontally to the side with your thumb parallel like a horizontal pinch." },
        "H": { emoji: "✌️", title: "Letter H", guide: "Extend both your index and middle fingers together horizontally to the side with thumb tucked in." },
        "I": { emoji: "🤙", title: "Letter I", guide: "Make a closed fist and extend only your pinky finger straight up into the air." },
        "K": { emoji: "✌️", title: "Letter K", guide: "Point your index finger straight up, extend your middle finger forward, and place your thumb between them." },
        "L": { emoji: "👆", title: "Letter L", guide: "Extend your thumb and index finger outward to form a crisp right-angled 'L' shape." },
        "M": { emoji: "👊", title: "Letter M", guide: "Fold your thumb beneath your first three fingers (index, middle, ring) poking out under your ring finger." },
        "N": { emoji: "👊", title: "Letter N", guide: "Fold your thumb beneath your first two fingers (index, middle) poking out under your middle finger." },
        "O": { emoji: "👌", title: "Letter O", guide: "Touch all fingertips and thumb tip together to form a full circle 'O' shape." },
        "P": { emoji: "👇", title: "Letter P", guide: "Make the 'K' handshape and point both extended fingers downward towards the ground." },
        "Q": { emoji: "👇", title: "Letter Q", guide: "Make the 'G' handshape and point index finger and thumb straight down." },
        "R": { emoji: "🤞", title: "Letter R", guide: "Cross your middle finger over your index finger like making a lucky wish." },
        "S": { emoji: "✊", title: "Letter S", guide: "Make a closed fist and place your thumb directly over the front of all folded fingers." },
        "T": { emoji: "👊", title: "Letter T", guide: "Make a fist and tuck your thumb directly between your index and middle fingers." },
        "U": { emoji: "✌️", title: "Letter U", guide: "Hold your index and middle fingers straight up held tightly together." },
        "V": { emoji: "✌️", title: "Letter V", guide: "Hold index and middle fingers straight up spread apart in a classic 'V' peace sign." },
        "W": { emoji: "🖐️", title: "Letter W", guide: "Hold your index, middle, and ring fingers straight up and spread apart like a 'W'." },
        "X": { emoji: "☝️", title: "Letter X", guide: "Make a fist with only the index finger raised, bent down into a small hook shape." },
        "Y": { emoji: "🤙", title: "Letter Y", guide: "Make a fist and stick out only your thumb and pinky finger (the classic 'hang loose' sign)." }
    };

    const grid = document.getElementById('guideGrid');
    Object.keys(signGuide).forEach(letter => {
        const item = signGuide[letter];
        const card = document.createElement('div');
        card.className = 'guide-card';
        card.innerHTML = `
            <div class="card-top">
                <div class="letter-badge">${letter}</div>
                <div>
                    <div class="card-title">${item.title}</div>
                    <div class="emoji-icon">${item.emoji}</div>
                </div>
            </div>
            <div class="instructions">${item.guide}</div>
        `;
        grid.appendChild(card);
    });
</script>

</body>
</html>
