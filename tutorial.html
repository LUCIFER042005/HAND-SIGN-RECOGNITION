<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Sign Tutorial & Dictionary</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #121417;
            color: #f8fafc;
            margin: 0;
            padding: 35px 15px;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #262b32;
            padding-bottom: 18px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 12px;
        }

        h1 {
            color: #ffffff;
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .btn-back {
            background: #1e2229;
            border: 1px solid #2d333b;
            color: #f8fafc;
            padding: 9px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            transition: 0.2s ease;
        }

        .btn-back:hover {
            background: #282e38;
            border-color: #3b424e;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }

        .guide-card {
            background: #181b20;
            border: 1px solid #262b32;
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .guide-card:hover {
            transform: translateY(-3px);
            border-color: #22c55e;
            box-shadow: 0 8px 25px rgba(34, 197, 94, 0.1);
        }

        .guide-card.special-card {
            border-color: #2d333b;
        }

        .guide-card.special-card:hover {
            border-color: #eab308;
            box-shadow: 0 8px 25px rgba(234, 179, 8, 0.1);
        }

        .card-top {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 12px;
        }

        .letter-badge {
            width: 50px;
            height: 50px;
            background: #13161a;
            border: 1px solid #22c55e;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
            color: #22c55e;
            flex-shrink: 0;
        }

        .special-card .letter-badge {
            border-color: #eab308;
            color: #eab308;
            font-size: 14px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
        }

        .instructions {
            font-size: 13px;
            color: #cbd5e1;
            line-height: 1.5;
            background: #13161a;
            padding: 12px 14px;
            border-radius: 8px;
            border-left: 3px solid #22c55e;
            border-top: 1px solid #22262c;
            border-right: 1px solid #22262c;
            border-bottom: 1px solid #22262c;
        }

        .special-card .instructions {
            border-left-color: #eab308;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📖 Custom Dataset Sign Language Guide</h1>
        <a href="/" class="btn-back">⬅ Return to Main App</a>
    </div>

    <div class="subtitle">
        Reference dictionary and hand posture instructions for your exact 24 custom trained gestures.
    </div>

    <div class="cards-grid" id="guideGrid">
        <!-- Cards generated by JavaScript -->
    </div>
</div>

<script>
    const signGuide = {
        "A": { title: "Sign A", guide: "Make a closed fist facing forward with all 4 fingers folded down and thumb resting upright along the side of the index finger." },
        "B": { title: "Sign B", guide: "Hold all 4 fingers straight up together, folding your thumb flat across your palm." },
        "C": { title: "Sign C", guide: "Curve your fingers and thumb sideways in an open arc to form the shape of the letter 'C'." },
        "D": { title: "Sign D", guide: "Point your index finger straight up into the air with the other fingers curled closed." },
        "E": { title: "Sign E", guide: "Curl all four fingertips tightly down into your palm with thumb tucked underneath." },
        "F": { title: "Sign F", guide: "Touch your index finger and thumb tip together in a circle, holding middle, ring, and pinky straight up." },
        "G": { title: "Sign G", guide: "Point your index finger horizontally to the side with thumb held parallel." },
        "H": { title: "Sign H", guide: "Extend both your index and middle fingers straight up together with thumb holding remaining fingers down." },
        "I": { title: "Sign I", guide: "Make a closed fist and extend only your pinky finger straight up into the air." },
        "J": { title: "Sign J", guide: "Hold your pinky finger straight up, ready to trace the 'J' letter curve in the air." },
        "K": { title: "Sign K", guide: "Point index and middle fingers in an angled 'V' with thumb placed directly between them." },
        "L": { title: "Sign L", guide: "Extend your index finger straight up and thumb outward to make a crisp 'L' shape." },
        "N": { title: "Sign N", guide: "Make a fist facing forward with your thumb folded tightly under the front fingers." },
        "O": { title: "Sign O", guide: "Touch all fingertips and thumb together in a circular ring 'O' shape." },
        "P": { title: "Sign P", guide: "Hand tilted pointing index finger forward and downward horizontally." },
        "Q": { title: "Sign Q", guide: "Point both your index finger and thumb downward in a pinch grip." },
        "R": { title: "Sign R", guide: "Cross your middle finger over your index finger like making a lucky wish." },
        "U": { title: "Sign U", guide: "Extend your index and pinky fingers upright while holding middle and ring fingers closed down." },
        "V": { title: "Sign V", guide: "Extend index and middle fingers straight up and spread them apart in a peace sign." },
        "W": { title: "Sign W", guide: "Hold index, middle, and ring fingers straight up and spread apart like a 'W'." },
        "X": { title: "Sign X", guide: "Make a fist with only the index finger raised and bent down into a small hook shape." },
        "Y": { title: "Sign Y", guide: "Make a fist and extend only your thumb and pinky finger outward (hang loose / shaka sign)." },
        "DELETE": { title: "Action: DELETE", guide: "Raise index and pinky fingers upright with middle and ring fingers closed (horns pose) to delete the last character." },
        "SPACE": { title: "Action: SPACE", guide: "Extend thumb, index, and pinky fingers outward with middle and ring folded (3-finger open pose) to insert a space." }
    };

    const grid = document.getElementById('guideGrid');
    Object.keys(signGuide).forEach(key => {
        const item = signGuide[key];
        const isSpecial = (key === "DELETE" || key === "SPACE");
        const card = document.createElement('div');
        card.className = `guide-card ${isSpecial ? 'special-card' : ''}`;
        card.innerHTML = `
            <div class="card-top">
                <div class="letter-badge">${isSpecial ? (key === 'DELETE' ? '⌫ DEL' : '␣ SPC') : key}</div>
                <div class="card-title">${item.title}</div>
            </div>
            <div class="instructions">${item.guide}</div>
        `;
        grid.appendChild(card);
    });
</script>

</body>
</html>
