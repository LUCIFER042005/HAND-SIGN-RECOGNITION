<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Language Tutorial & Dictionary</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            color: #fff;
            margin: 0;
            padding: 30px 15px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        h1 {
            color: #4af6c6;
            margin: 0;
            font-size: 26px;
        }
        .btn-back {
            background: #2a2a2a;
            border: 1px solid #4af6c6;
            color: #4af6c6;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
        }
        .btn-back:hover {
            background: #4af6c6;
            color: #121212;
        }
        .subtitle {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        .guide-card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .guide-card:hover {
            transform: translateY(-4px);
            border-color: #4af6c6;
            box-shadow: 0 6px 20px rgba(74, 246, 198, 0.1);
        }
        .card-top {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 12px;
        }
        .letter-badge {
            width: 55px;
            height: 55px;
            background: #2a2a2a;
            border: 2px solid #4af6c6;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: #4af6c6;
        }
        .card-title {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
        }
        .instructions {
            font-size: 13px;
            color: #bbb;
            line-height: 1.6;
            background: #252525;
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid #4af6c6;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📖 Official Sign Language Alphabet Guide</h1>
        <a href="/" class="btn-back">⬅ Return to Main App</a>
    </div>

    <div class="subtitle">
        Reference dictionary matching the official hand sign recognition dataset.
    </div>

    <div class="cards-grid" id="guideGrid">
        <!-- Cards generated by JavaScript -->
    </div>
</div>

<script>
    const signGuide = {
        "A": { title: "Sign A", guide: "Make a closed fist with all 4 fingers folded down, and keep your thumb resting upright along the side of the index finger." },
        "B": { title: "Sign B", guide: "Hold all 4 fingers straight up together, with your thumb folded flat across your palm." },
        "C": { title: "Sign C", guide: "Curve your fingers and thumb in an open arc to form the clear shape of the letter 'C'." },
        "D": { title: "Sign D", guide: "Point your index finger straight up into the air while your thumb touches the middle, ring, and pinky fingers to form an 'O'." },
        "E": { title: "Sign E", guide: "Curl all fingertips down onto the palm with the thumb tucked tightly across beneath the fingertips." },
        "F": { title: "Sign F", guide: "Touch the tips of your thumb and index finger together into a circle, holding the remaining three fingers (middle, ring, pinky) straight up." },
        "G": { title: "Sign G", guide: "Extend your index finger and thumb horizontally to the side, pointing outward parallel to each other." },
        "H": { title: "Sign H", guide: "Extend both your index and middle fingers together horizontally to the side with thumb tucked in." },
        "I": { title: "Sign I", guide: "Make a fist and raise only your pinky finger straight up into the air." },
        "J": { title: "Sign J", guide: "Make the 'I' sign with your pinky finger and trace a curve in the air in the shape of the letter 'J'." },
        "K": { title: "Sign K", guide: "Extend your index finger straight up, point your middle finger slightly forward, and place your thumb between them touching the middle finger knuckle." },
        "L": { title: "Sign L", guide: "Extend your thumb and index finger outward to form a sharp 90-degree 'L' shape." },
        "M": { title: "Sign M", guide: "Fold your thumb beneath your first three fingers (index, middle, ring) so the thumb tip pokes out between your ring and pinky finger." },
        "N": { title: "Sign N", guide: "Fold your thumb beneath your first two fingers (index, middle) so the thumb tip pokes out under your middle finger." },
        "O": { title: "Sign O", guide: "Touch all four fingertips and your thumb together to create an open circular 'O' shape." },
        "P": { title: "Sign P", guide: "Form the 'K' handshape and point both your index and middle fingers downward toward the floor." },
        "Q": { title: "Sign Q", guide: "Form the 'G' handshape and point both your index finger and thumb downward." },
        "R": { title: "Sign R", guide: "Cross your middle finger over the back of your index finger like making a lucky wish." },
        "S": { title: "Sign S", guide: "Make a closed fist and fold your thumb tightly across the front of all 4 fingers." },
        "T": { title: "Sign T", guide: "Make a fist and tuck your thumb tip upward directly between your index and middle fingers." },
        "U": { title: "Sign U", guide: "Hold both your index and middle fingers straight up held tightly together." },
        "V": { title: "Sign V", guide: "Hold your index and middle fingers straight up and spread them apart in a peace 'V' sign." },
        "W": { title: "Sign W", guide: "Hold your index, middle, and ring fingers straight up and spread apart in a 'W' shape." },
        "X": { title: "Sign X", guide: "Make a fist with only the index finger raised and curved down into a small hook shape." },
        "Y": { title: "Sign Y", guide: "Make a fist and extend only your thumb and pinky finger outward (the 'hang loose' hand gesture)." },
        "Z": { title: "Sign Z", guide: "Point your index finger and draw the letter 'Z' in the air in a zig-zag motion." }
    };

    const grid = document.getElementById('guideGrid');
    Object.keys(signGuide).forEach(letter => {
        const item = signGuide[letter];
        const card = document.createElement('div');
        card.className = 'guide-card';
        card.innerHTML = `
            <div class="card-top">
                <div class="letter-badge">${letter}</div>
                <div>
                    <div class="card-title">${item.title}</div>
                </div>
            </div>
            <div class="instructions">${item.guide}</div>
        `;
        grid.appendChild(card);
    });
</script>

</body>
</html>
