<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Sign Recognition & Sentence Builder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 620px;
            margin: auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.6);
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 480px;
            margin: auto;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #333;
            background-color: #000;
        }

        video {
            width: 100%;
            height: auto;
            transform: scaleX(-1); /* Mirror camera */
            display: block;
        }

        /* Transparent Glowing Skeleton Canvas */
        #overlayCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #hiddenCaptureCanvas {
            display: none;
        }

        .prediction-box {
            margin-top: 15px;
            font-size: 22px;
            font-weight: bold;
        }

        .predicted-char {
            color: #4af6c6;
            font-size: 30px;
        }

        .confidence-badge {
            font-size: 13px;
            color: #888;
            margin-left: 6px;
            font-weight: normal;
        }

        .sentence-container {
            margin-top: 15px;
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            text-align: left;
        }

        .sentence-box {
            min-height: 38px;
            font-size: 20px;
            color: #fff;
            word-wrap: break-word;
            border-bottom: 2px solid #4af6c6;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button, .btn-link {
            background-color: #333;
            color: white;
            border: 1px solid #555;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            text-decoration: none;
            display: inline-block;
            transition: 0.2s ease;
        }

        button:hover, .btn-link:hover {
            background-color: #444;
        }

        .btn-add {
            background-color: #2e7d32;
            border-color: #1b5e20;
        }
        .btn-add:hover {
            background-color: #388e3c;
        }

        .btn-clear {
            background-color: #c62828;
            border-color: #b71c1c;
        }
        .btn-clear:hover {
            background-color: #d32f2f;
        }

        .status-indicator {
            font-size: 13px;
            color: #aaa;
            margin-top: 5px;
        }

        .auth-card {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        input, textarea {
            padding: 10px;
            margin: 5px 0;
            width: 80%;
            border-radius: 4px;
            border: 1px solid #555;
            background: #121212;
            color: white;
        }

        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2a2a2a;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        #userPanel {
            display: none;
            background: #222;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #4af6c6;
            text-align: left;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Hand Sign Recognition</h1>
    <div style="font-size: 12px; color: #888; margin-bottom: 15px;">
        Registered Community: <span id="totalUserCount" style="color: #4af6c6; font-weight: bold;">0</span> Users
    </div>

    <!-- AUTHENTICATION FORM -->
    <div id="authSection" class="auth-card">
        <h3 id="authTitle">Sign In</h3>
        <input type="text" id="username" placeholder="Username" required><br>
        <input type="password" id="password" placeholder="Password" required><br>
        <div style="margin-top: 10px;">
            <button class="btn-add" onclick="handleLogin()">Login</button>
            <button onclick="handleRegister()">Register</button>
        </div>
        <p id="authMsg" style="font-size: 13px; color: #ff6b6b; margin-top: 8px;"></p>
    </div>

    <!-- MAIN APP WORKSPACE -->
    <div id="appSection" style="display: none;">
        <div class="user-bar">
            <span>Welcome, <b id="loggedInUser" style="color: #4af6c6;">User</b></span>
            <div>
                <a href="/tutorial" target="_blank" class="btn-link" style="background:#2e7d32;">Tutorial</a>
                <button onclick="toggleUserPanel()">Profile</button>
                <button onclick="handleLogout()" class="btn-clear">Logout</button>
            </div>
        </div>

        <!-- PROFILE DRAWER -->
        <div id="userPanel">
            <h4 style="margin-top:0; color:#4af6c6;">Account Settings</h4>
            <div>
                <b>Change Password</b><br>
                <input type="password" id="oldPassInput" placeholder="Old Password"><br>
                <input type="password" id="newPassInput" placeholder="New Password"><br>
                <button class="btn-add" onclick="handleChangePassword()">Update Password</button>
            </div>
            <hr style="border: 0; border-top: 1px solid #444; margin: 15px 0;">
            <div>
                <b>Submit Feedback / Review</b><br>
                <textarea id="reviewInput" rows="3" placeholder="Leave a review..."></textarea><br>
                <button class="btn-add" onclick="handleSubmitReview()">Submit Review</button>
            </div>
            <hr style="border: 0; border-top: 1px solid #444; margin: 15px 0;">
            <div>
                <button class="btn-clear" onclick="handleDeleteOwnAccount()">Delete Account</button>
            </div>
            <p id="panelMsg" style="font-size: 12px; color: #4af6c6; margin-top: 8px;"></p>
        </div>

        <!-- CAMERA WITH TRANSPARENT SKELETON CANVAS OVERLAY -->
        <div class="video-wrapper">
            <video id="webcam" autoplay playsinline></video>
            <canvas id="overlayCanvas"></canvas>
        </div>
        <canvas id="hiddenCaptureCanvas"></canvas>

        <div class="prediction-box">
            Recognized Sign: <span id="currentSign" class="predicted-char">-</span>
            <span id="confidenceSpan" class="confidence-badge"></span>
            <div id="statusIndicator" class="status-indicator">Sentence Builder OFF. Press 'S' to toggle.</div>
        </div>

        <div class="sentence-container">
            <div style="font-size: 12px; text-transform: uppercase; color: #888; margin-bottom: 5px;">Sentence Output</div>
            <div id="sentenceBox" class="sentence-box"></div>

            <div class="controls">
                <button class="btn-add" onclick="addCurrentSign()">Add Sign</button>
                <button onclick="addSpace()">Space [ ]</button>
                <button onclick="backspace()">Backspace ⌫</button>
                <button class="btn-clear" onclick="clearSentence()">Clear All</button>
            </div>
        </div>

        <div style="margin-top: 15px; font-size: 14px; text-align: left;">
            <label style="cursor: pointer;">
                <input type="checkbox" id="sentenceBuilderToggle"> Enable Auto-Append on Hold (Press <b>'S'</b>)
            </label>
        </div>
    </div>
</div>

<script>
    const authSection = document.getElementById('authSection');
    const appSection = document.getElementById('appSection');
    const authMsg = document.getElementById('authMsg');
    const loggedInUserSpan = document.getElementById('loggedInUser');
    const totalUserCountSpan = document.getElementById('totalUserCount');
    const userPanel = document.getElementById('userPanel');
    const panelMsg = document.getElementById('panelMsg');

    const video = document.getElementById('webcam');
    const overlayCanvas = document.getElementById('overlayCanvas');
    const hiddenCaptureCanvas = document.getElementById('hiddenCaptureCanvas');
    const currentSignSpan = document.getElementById('currentSign');
    const confidenceSpan = document.getElementById('confidenceSpan');
    const sentenceBox = document.getElementById('sentenceBox');
    const sentenceBuilderToggle = document.getElementById('sentenceBuilderToggle');
    const statusIndicator = document.getElementById('statusIndicator');

    let currentPredictedSign = "";
    let lastSign = "";
    let signHoldStartTime = null;
    let isProcessing = false;
    let processIntervalId = null;
    let activeUsername = "";
    let activePassword = "";
    const HOLD_THRESHOLD_MS = 1200;

    // MediaPipe Hand Landmark Connections
    const HAND_CONNECTIONS = [
        [0, 1], [1, 2], [2, 3], [3, 4],       // Thumb
        [0, 5], [5, 6], [6, 7], [7, 8],       // Index
        [5, 9], [9, 10], [10, 11], [11, 12],  // Middle
        [9, 13], [13, 14], [14, 15], [15, 16],// Ring
        [13, 17], [17, 18], [18, 19], [19, 20],// Pinky
        [0, 17]                               // Palm Base
    ];

    async function fetchUserCount() {
        try {
            const res = await fetch('/users/count');
            const data = await res.json();
            if (data.total_users !== undefined) {
                totalUserCountSpan.innerText = data.total_users;
            }
        } catch (err) {
            console.error("Failed to fetch user count", err);
        }
    }

    async function handleRegister() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        if (!username || !password) {
            authMsg.innerText = "Please provide username and password.";
            return;
        }

        try {
            const res = await fetch('/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            });
            const data = await res.json();
            if (res.ok) {
                authMsg.style.color = "#4af6c6";
                authMsg.innerText = "Account created! You can now log in.";
                fetchUserCount();
            } else {
                authMsg.style.color = "#ff6b6b";
                authMsg.innerText = data.detail || "Registration failed.";
            }
        } catch (err) {
            authMsg.style.color = "#ff6b6b";
            authMsg.innerText = "Network error.";
        }
    }

    async function handleLogin() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        if (!username || !password) {
            authMsg.innerText = "Please provide username and password.";
            return;
        }

        try {
            const res = await fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            });
            const data = await res.json();
            if (res.ok) {
                activeUsername = username;
                activePassword = password;
                authSection.style.display = 'none';
                appSection.style.display = 'block';
                loggedInUserSpan.innerText = data.username;

                startWebcam();
                if (!processIntervalId) {
                    processIntervalId = setInterval(processFrame, 300);
                }
            } else {
                authMsg.style.color = "#ff6b6b";
                authMsg.innerText = data.detail || "Login failed.";
            }
        } catch (err) {
            authMsg.style.color = "#ff6b6b";
            authMsg.innerText = "Network error.";
        }
    }

    function toggleUserPanel() {
        userPanel.style.display = userPanel.style.display === 'block' ? 'none' : 'block';
        panelMsg.innerText = "";
    }

    async function handleChangePassword() {
        const oldPass = document.getElementById('oldPassInput').value.trim();
        const newPass = document.getElementById('newPassInput').value.trim();
        if (!oldPass || !newPass) {
            panelMsg.innerText = "Please fill in all password fields.";
            return;
        }

        try {
            const res = await fetch('/users/change-password', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: activeUsername, old_password: oldPass, new_password: newPass})
            });
            const data = await res.json();
            if (res.ok) {
                panelMsg.style.color = "#4af6c6";
                panelMsg.innerText = "Password updated successfully.";
                activePassword = newPass;
                document.getElementById('oldPassInput').value = "";
                document.getElementById('newPassInput').value = "";
            } else {
                panelMsg.style.color = "#ff6b6b";
                panelMsg.innerText = data.detail || "Password update failed.";
            }
        } catch (err) {
            panelMsg.style.color = "#ff6b6b";
            panelMsg.innerText = "Error updating password.";
        }
    }

    async function handleSubmitReview() {
        const review = document.getElementById('reviewInput').value.trim();
        if (!review) {
            panelMsg.innerText = "Please enter feedback.";
            return;
        }

        try {
            const res = await fetch('/users/submit-review', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: activeUsername, review: review})
            });
            const data = await res.json();
            if (res.ok) {
                panelMsg.style.color = "#4af6c6";
                panelMsg.innerText = "Feedback received. Thank you!";
                document.getElementById('reviewInput').value = "";
            } else {
                panelMsg.style.color = "#ff6b6b";
                panelMsg.innerText = "Failed to submit feedback.";
            }
        } catch (err) {
            panelMsg.style.color = "#ff6b6b";
            panelMsg.innerText = "Error submitting feedback.";
        }
    }

    async function handleDeleteOwnAccount() {
        if (confirm("Are you sure you want to permanently delete your account?")) {
            try {
                const res = await fetch('/users/delete-me', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: activeUsername, password: activePassword})
                });
                const data = await res.json();
                if (res.ok) {
                    alert("Account deleted.");
                    handleLogout();
                } else {
                    alert(data.detail || "Error deleting account.");
                }
            } catch (err) {
                alert("Network error.");
            }
        }
    }

    function handleLogout() {
        if (processIntervalId) clearInterval(processIntervalId);
        window.location.reload();
    }

    async function startWebcam() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }
            });
            video.srcObject = stream;
        } catch (err) {
            alert("Error accessing camera: " + err.message);
        }
    }

    window.addEventListener('keydown', (e) => {
        if (appSection.style.display === 'block' && (e.key === 's' || e.key === 'S')) {
            sentenceBuilderToggle.checked = !sentenceBuilderToggle.checked;
            updateStatusText();
            if (!sentenceBuilderToggle.checked) resetHoldTimer();
        }
    });

    sentenceBuilderToggle.addEventListener('change', () => {
        updateStatusText();
        if (!sentenceBuilderToggle.checked) resetHoldTimer();
    });

    function updateStatusText() {
        if (sentenceBuilderToggle.checked) {
            statusIndicator.innerText = "Sentence Builder ACTIVE. Hold sign steady to append.";
        } else {
            statusIndicator.innerText = "Sentence Builder OFF. Press 'S' to start.";
        }
    }

    // DRAW TRANSPARENT SKELETON
    function drawSkeleton(landmarks) {
        const ctx = overlayCanvas.getContext('2d');
        const w = overlayCanvas.width;
        const h = overlayCanvas.height;

        ctx.clearRect(0, 0, w, h);
        if (!landmarks || landmarks.length === 0) return;

        // Convert normalized coordinates (mirrored horizontally for user view)
        const points = landmarks.map(lm => ({
            x: (1 - lm.x) * w,
            y: lm.y * h
        }));

        // Draw Translucent Bones
        ctx.strokeStyle = "rgba(74, 246, 198, 0.45)"; // Soft glowing neon cyan
        ctx.lineWidth = 3;
        ctx.lineCap = "round";

        HAND_CONNECTIONS.forEach(([startIdx, endIdx]) => {
            const start = points[startIdx];
            const end = points[endIdx];
            if (start && end) {
                ctx.beginPath();
                ctx.moveTo(start.x, start.y);
                ctx.lineTo(end.x, end.y);
                ctx.stroke();
            }
        });

        // Draw Translucent Glowing Joints
        points.forEach((pt, i) => {
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, (i === 4 || i === 8 || i === 12 || i === 16 || i === 20) ? 5 : 3.5, 0, 2 * Math.PI);
            ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
            ctx.shadowColor = "#4af6c6";
            ctx.shadowBlur = 6;
            ctx.fill();
            ctx.shadowBlur = 0; // Reset blur
        });
    }

    async function processFrame() {
        if (isProcessing || !video.videoWidth) return;

        isProcessing = true;

        // Match overlay canvas size to video dimensions
        if (overlayCanvas.width !== video.videoWidth || overlayCanvas.height !== video.videoHeight) {
            overlayCanvas.width = video.videoWidth;
            overlayCanvas.height = video.videoHeight;
        }

        const captureCtx = hiddenCaptureCanvas.getContext('2d');
        hiddenCaptureCanvas.width = 320;
        hiddenCaptureCanvas.height = 240;

        captureCtx.drawImage(video, 0, 0, hiddenCaptureCanvas.width, hiddenCaptureCanvas.height);

        hiddenCaptureCanvas.toBlob(async (blob) => {
            if (!blob) {
                isProcessing = false;
                return;
            }

            const formData = new FormData();
            formData.append('file', blob, 'frame.jpg');

            try {
                const response = await fetch('/predict', { method: 'POST', body: formData });
                const data = await response.json();

                if (data.success && data.prediction) {
                    currentPredictedSign = data.prediction;
                    currentSignSpan.innerText = currentPredictedSign;
                    confidenceSpan.innerText = `(${data.confidence}%)`;

                    drawSkeleton(data.landmarks);

                    if (sentenceBuilderToggle.checked) {
                        handleAutoAppend(currentPredictedSign);
                    }
                } else {
                    currentPredictedSign = "";
                    currentSignSpan.innerText = "-";
                    confidenceSpan.innerText = "";
                    drawSkeleton([]);
                    resetHoldTimer();
                }
            } catch (err) {
                console.error("Prediction error:", err);
                drawSkeleton([]);
            } finally {
                isProcessing = false;
            }
        }, 'image/jpeg', 0.6);
    }

    function handleAutoAppend(sign) {
        const now = Date.now();

        if (sign === lastSign) {
            const elapsed = now - signHoldStartTime;
            if (elapsed >= HOLD_THRESHOLD_MS) {
                executeSignAction(sign);
                signHoldStartTime = now + 1200;
            } else {
                const percent = Math.round((elapsed / HOLD_THRESHOLD_MS) * 100);
                statusIndicator.innerText = `Holding '${sign}'... ${percent}%`;
            }
        } else {
            lastSign = sign;
            signHoldStartTime = now;
            statusIndicator.innerText = `Holding '${sign}'...`;
        }
    }

    function executeSignAction(sign) {
        if (sign === "DELETE") {
            sentenceBox.innerText = sentenceBox.innerText.slice(0, -1);
            statusIndicator.innerText = "Action: Deleted character ⌫";
        } else if (sign === "SPACE") {
            sentenceBox.innerText += " ";
            statusIndicator.innerText = "Action: Added space [ ]";
        } else {
            sentenceBox.innerText += sign;
            statusIndicator.innerText = `Added '${sign}'`;
        }
    }

    function resetHoldTimer() {
        lastSign = "";
        signHoldStartTime = null;
        updateStatusText();
    }

    function addCurrentSign() {
        if (currentPredictedSign) {
            executeSignAction(currentPredictedSign);
        }
    }

    function addSpace() { sentenceBox.innerText += " "; }
    function backspace() { sentenceBox.innerText = sentenceBox.innerText.slice(0, -1); }
    function clearSentence() { sentenceBox.innerText = ""; resetHoldTimer(); }

    fetchUserCount();
</script>

</body>
</html>
