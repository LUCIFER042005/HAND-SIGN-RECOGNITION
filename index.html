<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Sign Recognition & Sentence Builder</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0e17;
            --card-bg: rgba(21, 28, 44, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent: #38ef7d;
            --accent-gradient: linear-gradient(135deg, #11998e, #38ef7d);
            --special-accent: #f7971e;
            --special-gradient: linear-gradient(135deg, #f7971e, #ffd200);
            --danger: #ff4b4b;
            --text-main: #f0f4f8;
            --text-muted: #8a99ad;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-base);
            background-image:
                radial-gradient(at 10% 10%, rgba(17, 153, 142, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(56, 239, 125, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            padding: 30px 15px;
            text-align: center;
            min-height: 100vh;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 28px;
            border-radius: 20px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .user-counter {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 22px;
        }
        .user-counter span {
            color: var(--accent);
            font-weight: 700;
        }

        /* Auth Card */
        .auth-card {
            max-width: 380px;
            margin: 20px auto;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            padding: 25px;
            border-radius: 16px;
        }

        input, textarea {
            width: 90%;
            padding: 12px 14px;
            margin: 8px 0;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.4);
            color: var(--text-main);
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.2s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(56, 239, 125, 0.2);
        }

        .auth-btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 15px;
        }

        /* Buttons */
        button, .btn-link {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        button:hover, .btn-link:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-1px);
        }

        button.primary {
            background: var(--accent-gradient);
            color: #0a0e17;
            border: none;
            font-weight: 700;
        }

        button.primary:hover {
            box-shadow: 0 0 18px rgba(56, 239, 125, 0.4);
        }

        button.danger {
            background: rgba(255, 75, 75, 0.15);
            color: #ff6b6b;
            border-color: rgba(255, 75, 75, 0.3);
        }

        button.danger:hover {
            background: var(--danger);
            color: #fff;
            box-shadow: 0 0 18px rgba(255, 75, 75, 0.4);
        }

        /* User Bar */
        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            padding: 10px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .user-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-tutorial {
            background: var(--special-gradient);
            color: #0a0e17 !important;
            border: none;
            font-weight: 700;
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 8px;
        }

        /* Video wrapper */
        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        video {
            width: 100%;
            height: auto;
            transform: scaleX(-1);
            display: block;
        }

        canvas { display: none; }

        /* Prediction Card */
        .prediction-box {
            margin: 16px 0;
            font-size: 18px;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.3);
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }

        .predicted-char {
            color: var(--accent);
            font-size: 28px;
            font-weight: 700;
            margin-left: 8px;
        }

        /* Sentence Box */
        .sentence-container {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--card-border);
            padding: 18px;
            border-radius: 14px;
            margin-top: 16px;
            text-align: left;
        }

        .sentence-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .sentence-box {
            min-height: 50px;
            font-size: 22px;
            font-weight: 600;
            color: #fff;
            word-wrap: break-word;
            border-bottom: 2px solid var(--accent);
            padding: 6px 0;
            margin-bottom: 12px;
        }

        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .status-indicator {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .shortcut-badge {
            background: rgba(56, 239, 125, 0.12);
            color: var(--accent);
            padding: 2px 6px;
            border-radius: 6px;
            border: 1px solid rgba(56, 239, 125, 0.3);
            font-weight: 700;
        }

        /* Profile Modal */
        #userPanel {
            display: none;
            background: rgba(16, 22, 34, 0.95);
            border: 1px solid rgba(56, 239, 125, 0.3);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            text-align: left;
        }

        .panel-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Hand Sign Recognition</h1>
    <div class="user-counter">👥 Community: <span id="totalUserCount">0</span> users registered</div>

    <!-- LOGIN / REGISTER SECTION -->
    <div id="authSection" class="auth-card">
        <h2 id="authTitle" style="margin-bottom: 12px; font-size: 18px; color: var(--accent);">Sign In</h2>
        <input type="text" id="username" placeholder="Username" required><br>
        <input type="password" id="password" placeholder="Password" required><br>

        <div class="auth-btn-group">
            <button class="primary" onclick="handleLogin()">Login</button>
            <button onclick="handleRegister()">Register</button>
        </div>
        <p id="authMsg" style="font-size: 12px; color: var(--danger); margin-top: 12px;"></p>
    </div>

    <!-- MAIN APP SECTION -->
    <div id="appSection" style="display: none;">
        <div class="user-bar">
            <span>Welcome, <b id="loggedInUser" style="color: var(--accent);">User</b></span>
            <div class="user-actions">
                <a href="/tutorial" target="_blank" class="btn-link btn-tutorial">📖 Tutorial</a>
                <button onclick="toggleUserPanel()" style="padding: 6px 12px; font-size: 12px;">⚙️ Profile</button>
                <button onclick="handleLogout()" style="padding: 6px 12px; font-size: 12px;">Logout</button>
            </div>
        </div>

        <!-- USER PROFILE PANEL -->
        <div id="userPanel">
            <h3 style="margin-bottom: 14px; font-size: 16px; color: var(--text-main);">⚙️ Account Settings</h3>

            <div style="margin-bottom: 16px;">
                <div class="panel-title">Change Password</div>
                <input type="password" id="oldPassInput" placeholder="Current Password"><br>
                <input type="password" id="newPassInput" placeholder="New Password"><br>
                <button class="primary" onclick="handleChangePassword()" style="padding: 8px 14px; margin-top: 6px;">Update Password</button>
            </div>

            <hr style="border: none; border-top: 1px solid var(--card-border); margin: 16px 0;">

            <div style="margin-bottom: 16px;">
                <div class="panel-title">Send Feedback</div>
                <textarea id="reviewInput" rows="3" placeholder="Write your experience..."></textarea><br>
                <button class="primary" onclick="handleSubmitReview()" style="padding: 8px 14px; margin-top: 6px;">Submit Review</button>
            </div>

            <hr style="border: none; border-top: 1px solid var(--card-border); margin: 16px 0;">

            <div>
                <button class="danger" onclick="handleDeleteOwnAccount()" style="padding: 8px 14px;">Delete Account Permanently</button>
            </div>

            <p id="panelMsg" style="font-size: 12px; color: var(--accent); margin-top: 10px;"></p>
        </div>

        <div class="video-wrapper">
            <video id="webcam" autoplay playsinline></video>
        </div>
        <canvas id="canvas"></canvas>

        <div class="prediction-box">
            Recognized Sign: <span id="currentSign" class="predicted-char">-</span>
            <div id="statusIndicator" class="status-indicator">Sentence Builder OFF. Press <span class="shortcut-badge">S</span> to toggle.</div>
        </div>

        <div class="sentence-container">
            <div class="sentence-label">Sentence Builder</div>
            <div id="sentenceBox" class="sentence-box"></div>

            <div class="controls">
                <button class="primary" onclick="addCurrentSign()">Add Sign</button>
                <button onclick="addSpace()">Space [ ]</button>
                <button onclick="backspace()">Backspace ⌫</button>
                <button class="danger" onclick="clearSentence()">Clear</button>
            </div>
        </div>

        <div style="margin-top: 18px; font-size: 13px; color: var(--text-muted);">
            <label style="cursor: pointer;">
                <input type="checkbox" id="sentenceBuilderToggle"> Auto-Append when Held (<span class="shortcut-badge">S</span>)
            </label>
        </div>
    </div>
</div>

<script>
    const authSection = document.getElementById('authSection');
    const appSection = document.getElementById('appSection');
    const authMsg = document.getElementById('authMsg');
    const loggedInUserSpan = document.getElementById('loggedInUser');
    const totalUserCountSpan = document.getElementById('totalUserCount');
    const userPanel = document.getElementById('userPanel');
    const panelMsg = document.getElementById('panelMsg');

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const currentSignSpan = document.getElementById('currentSign');
    const sentenceBox = document.getElementById('sentenceBox');
    const sentenceBuilderToggle = document.getElementById('sentenceBuilderToggle');
    const statusIndicator = document.getElementById('statusIndicator');

    let currentPredictedSign = "";
    let lastSign = "";
    let signHoldStartTime = null;
    let isProcessing = false;
    let processIntervalId = null;
    let activeUsername = "";
    let activePassword = "";
    const HOLD_THRESHOLD_MS = 1200;

    async function fetchUserCount() {
        try {
            const res = await fetch('/users/count');
            const data = await res.json();
            if (data.total_users !== undefined) {
                totalUserCountSpan.innerText = data.total_users;
            }
        } catch (err) {
            console.error("Failed to fetch user count", err);
        }
    }

    async function handleRegister() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        if (!username || !password) {
            authMsg.style.color = "var(--danger)";
            authMsg.innerText = "Please enter both username and password.";
            return;
        }

        try {
            const res = await fetch('/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            });
            const data = await res.json();
            if (res.ok) {
                authMsg.style.color = "var(--accent)";
                authMsg.innerText = "Account created! You can now login.";
                fetchUserCount();
            } else {
                authMsg.style.color = "var(--danger)";
                authMsg.innerText = data.detail || "Registration failed.";
            }
        } catch (err) {
            authMsg.style.color = "var(--danger)";
            authMsg.innerText = "Network error. Please try again.";
        }
    }

    async function handleLogin() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        if (!username || !password) {
            authMsg.style.color = "var(--danger)";
            authMsg.innerText = "Please enter both username and password.";
            return;
        }

        try {
            const res = await fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            });
            const data = await res.json();
            if (res.ok) {
                activeUsername = username;
                activePassword = password;
                authSection.style.display = 'none';
                appSection.style.display = 'block';
                loggedInUserSpan.innerText = data.username;

                startWebcam();
                // 250ms polling loop for responsive inference
                if (!processIntervalId) {
                    processIntervalId = setInterval(processFrame, 250);
                }
            } else {
                authMsg.style.color = "var(--danger)";
                authMsg.innerText = data.detail || "Login failed.";
            }
        } catch (err) {
            authMsg.style.color = "var(--danger)";
            authMsg.innerText = "Network error. Please try again.";
        }
    }

    function toggleUserPanel() {
        userPanel.style.display = userPanel.style.display === 'block' ? 'none' : 'block';
        panelMsg.innerText = "";
    }

    async function handleChangePassword() {
        const oldPass = document.getElementById('oldPassInput').value.trim();
        const newPass = document.getElementById('newPassInput').value.trim();
        if (!oldPass || !newPass) {
            panelMsg.style.color = "var(--danger)";
            panelMsg.innerText = "Please fill in all password fields.";
            return;
        }

        try {
            const res = await fetch('/users/change-password', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: activeUsername, old_password: oldPass, new_password: newPass})
            });
            const data = await res.json();
            if (res.ok) {
                panelMsg.style.color = "var(--accent)";
                panelMsg.innerText = "Password updated successfully!";
                activePassword = newPass;
                document.getElementById('oldPassInput').value = "";
                document.getElementById('newPassInput').value = "";
            } else {
                panelMsg.style.color = "var(--danger)";
                panelMsg.innerText = data.detail || "Password update failed.";
            }
        } catch (err) {
            panelMsg.style.color = "var(--danger)";
            panelMsg.innerText = "Error updating password.";
        }
    }

    async function handleSubmitReview() {
        const review = document.getElementById('reviewInput').value.trim();
        if (!review) {
            panelMsg.style.color = "var(--danger)";
            panelMsg.innerText = "Please write a review before submitting.";
            return;
        }

        try {
            const res = await fetch('/users/submit-review', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: activeUsername, review: review})
            });
            const data = await res.json();
            if (res.ok) {
                panelMsg.style.color = "var(--accent)";
                panelMsg.innerText = "Thank you! Feedback received.";
                document.getElementById('reviewInput').value = "";
            } else {
                panelMsg.style.color = "var(--danger)";
                panelMsg.innerText = "Failed to submit review.";
            }
        } catch (err) {
            panelMsg.style.color = "var(--danger)";
            panelMsg.innerText = "Error submitting feedback.";
        }
    }

    async function handleDeleteOwnAccount() {
        if (confirm("Are you sure you want to permanently delete your account?")) {
            try {
                const res = await fetch('/users/delete-me', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: activeUsername, password: activePassword})
                });
                const data = await res.json();
                if (res.ok) {
                    alert("Account deleted.");
                    handleLogout();
                } else {
                    alert(data.detail || "Could not delete account.");
                }
            } catch (err) {
                alert("Network error.");
            }
        }
    }

    function handleLogout() {
        if (processIntervalId) clearInterval(processIntervalId);
        window.location.reload();
    }

    async function startWebcam() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }
            });
            video.srcObject = stream;
        } catch (err) {
            alert("Error accessing camera: " + err.message);
        }
    }

    window.addEventListener('keydown', (e) => {
        if (appSection.style.display === 'block' && (e.key === 's' || e.key === 'S')) {
            sentenceBuilderToggle.checked = !sentenceBuilderToggle.checked;
            updateStatusText();
            if (!sentenceBuilderToggle.checked) resetHoldTimer();
        }
    });

    sentenceBuilderToggle.addEventListener('change', () => {
        updateStatusText();
        if (!sentenceBuilderToggle.checked) resetHoldTimer();
    });

    function updateStatusText() {
        if (sentenceBuilderToggle.checked) {
            statusIndicator.innerText = "Sentence Builder ACTIVE. Hold sign steady to append/act.";
        } else {
            statusIndicator.innerText = "Sentence Builder OFF. Press 'S' to start appending.";
        }
    }

    async function processFrame() {
        if (isProcessing || !video.videoWidth) return;

        isProcessing = true;
        const ctx = canvas.getContext('2d');

        // Downscale to 320x240 for rapid network transport
        canvas.width = 320;
        canvas.height = 240;

        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // Compress at 0.5 quality (under 15 KB payload)
        canvas.toBlob(async (blob) => {
            if (!blob) {
                isProcessing = false;
                return;
            }

            const formData = new FormData();
            formData.append('file', blob, 'frame.jpg');

            try {
                const response = await fetch('/predict', { method: 'POST', body: formData });
                const data = await response.json();

                if (data.success && data.prediction) {
                    currentPredictedSign = data.prediction;
                    currentSignSpan.innerText = currentPredictedSign;

                    if (sentenceBuilderToggle.checked) {
                        handleAutoAppend(currentPredictedSign);
                    }
                } else {
                    currentPredictedSign = "";
                    currentSignSpan.innerText = "-";
                    resetHoldTimer();
                }
            } catch (err) {
                console.error("Prediction error:", err);
            } finally {
                isProcessing = false;
            }
        }, 'image/jpeg', 0.5);
    }

    function handleAutoAppend(sign) {
        const now = Date.now();

        if (sign === lastSign) {
            const elapsed = now - signHoldStartTime;
            if (elapsed >= HOLD_THRESHOLD_MS) {
                executeSignAction(sign);
                signHoldStartTime = now + 1200;
            } else {
                const percent = Math.round((elapsed / HOLD_THRESHOLD_MS) * 100);
                statusIndicator.innerText = `Holding '${sign}'... ${percent}%`;
            }
        } else {
            lastSign = sign;
            signHoldStartTime = now;
            statusIndicator.innerText = `Holding '${sign}'...`;
        }
    }

    function executeSignAction(sign) {
        if (sign === "DELETE") {
            sentenceBox.innerText = sentenceBox.innerText.slice(0, -1);
            statusIndicator.innerText = "Action: Deleted last character ⌫";
        } else if (sign === "SPACE") {
            sentenceBox.innerText += " ";
            statusIndicator.innerText = "Action: Added space [ ]";
        } else {
            sentenceBox.innerText += sign;
            statusIndicator.innerText = `Added '${sign}'`;
        }
    }

    function resetHoldTimer() {
        lastSign = "";
        signHoldStartTime = null;
        updateStatusText();
    }

    function addCurrentSign() {
        if (currentPredictedSign) {
            executeSignAction(currentPredictedSign);
        }
    }

    function addSpace() { sentenceBox.innerText += " "; }
    function backspace() { sentenceBox.innerText = sentenceBox.innerText.slice(0, -1); }
    function clearSentence() { sentenceBox.innerText = ""; resetHoldTimer(); }

    fetchUserCount();
</script>

</body>
</html>
